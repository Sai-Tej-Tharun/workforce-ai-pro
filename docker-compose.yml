services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: workforce_ai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes: [dbdata:/var/lib/mysql]
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-change-me}"], interval: 5s, retries: 20 }
  api:
    build: ./backend
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-change-me}@db:3306/workforce_ai?charset=utf8mb4
      SECRET_KEY: ${SECRET_KEY:-change-me-to-a-long-random-string-at-least-32-chars}
      CORS_ORIGINS: http://localhost:8080
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
    volumes: [uploads:/app/uploads, models:/app/ml/artifacts]
  web:
    build: ./frontend
    depends_on: [api]
    ports: ["8080:80"]
volumes: { dbdata: {}, uploads: {}, models: {} }
